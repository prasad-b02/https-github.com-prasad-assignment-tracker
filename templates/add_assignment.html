<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Assignment | LearnSync R23</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>

    <div class="sidebar">
        <h2>📊 Assignment Tracker</h2>
        <ul class="nav-links">
            <li><a href="{{ url_for('learn_hub') }}">📖 1. Subjects Concepts</a></li>
            <li><a href="{{ url_for('project_guide') }}">ℹ️ 2. All About Project</a></li>
            <li><a href="{{ url_for('profile') }}">👤 3. User Profile</a></li>
            <li><a href="{{ url_for('index') }}">📊 4. Assignment Dashboard</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h1>➕ Add New Assignment</h1>
            <a href="{{ url_for('index') }}" class="btn-primary" style="background: #3b82f6;">⬅️ Back to Dashboard</a>
        </div>

        <div class="dashboard-card" style="max-width: 650px; margin: 2rem auto; padding: 2rem;">
            <form action="{{ url_for('add_assignment') }}" method="POST">
                
                <h3>Step 1: Subject & Title</h3>
                <div style="margin-bottom: 1.2rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Subject Name</label>
                    <input type="text" name="subject" required placeholder="e.g., Python Programming" style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: #fff;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Assignment Title</label>
                    <input type="text" name="title" required placeholder="e.g., Lab Record Unit 1" style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: #fff;">
                </div>

                <h3>Step 2: Submission Deadline</h3>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Deadline Date</label>
                    <input type="date" name="deadline" required style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: #fff;">
                </div>

                <h3>Step 3: Select Priority</h3>
                <div style="margin-bottom: 1.5rem;">
                    <select name="priority" required style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: #fff;">
                        <option value="High">🔴 High Priority</option>
                        <option value="Medium" selected>🟡 Medium Priority</option>
                        <option value="Low">🟢 Low Priority</option>
                    </select>
                </div>

                <h3>Step 4: Status & Save</h3>
                <div style="margin-bottom: 1.5rem;">
                    <select name="status" required style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: #fff;">
                        <option value="Pending" selected>⏳ Pending</option>
                        <option value="Completed">✅ Completed</option>
                        <option value="Postponed">🛑 Postponed</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; cursor: pointer;">💾 Save Assignment</button>
            </form>
        </div>
    </div>

</body>
</html>
